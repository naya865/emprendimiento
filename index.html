<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N'ROSEN Studio - Lencería y Loungewear</title>
    
    <!-- Fuentes de Google: Playfair Display, Great Vibes y Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tu archivo de estilos CSS separado -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- React y ReactDOM vía CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SDK de EmailJS para envío de correos -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
           emailjs.init({
             publicKey: "d7wpulaVRqCiLsCLE", 
           });
        })();
    </script>
</head>
<body>
    <div id="root"></div>

    <!-- CONFIGURACIÓN E INICIALIZACIÓN DE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Credenciales oficiales de tu proyecto NROSEN-Studio
        const firebaseConfig = {
            apiKey: "AIzaSyB9rDbJlKN3Uc90HaeuX9celSyS6_kh-nA",
            authDomain: "nrosen-studio.firebaseapp.com",
            projectId: "nrosen-studio",
            storageBucket: "nrosen-studio.firebasestorage.app",
            messagingSenderId: "686091305955",
            appId: "1:686091305955:web:964c933f6f34bc3c6c56d6"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Exponer Firebase al objeto global de la ventana (Window) para React
        window.db = db;
        window.firebaseTools = { collection, getDocs, addDoc };

        // Notificar a la app cuando Firebase esté listo
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <!-- Script principal de la aplicación React con compilador Babel -->
    <script type="text/babel" src="script.js"></script>
</body>
</html>
